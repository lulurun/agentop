<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agentop-desktop</title>
    <link rel="stylesheet" href="start.css" />
  </head>
  <body>
    <main>
      <h1 id="title">Starting agentop…</h1>
      <p id="detail">Starting the service on this computer.</p>

      <div id="setup" hidden>
        <section><h2>Tools</h2><ul id="tools"></ul></section>
        <section><h2>Agent tools</h2><ul id="agents"></ul></section>
        <section><h2>Install</h2><ul id="install"></ul></section>
        <div id="path-fix" hidden>
          <pre id="path-line"></pre>
          <button type="button" id="add-path"></button>
        </div>
        <pre id="tail" hidden></pre>
        <p id="setup-log" class="small" hidden></p>
      </div>

      <pre id="log" hidden></pre>
      <div id="actions">
        <button type="button" id="check" hidden>Check again</button>
        <button type="button" id="launch" class="primary" hidden>Launch agentop</button>
        <button type="button" id="retry" hidden>Try again</button>
        <button type="button" id="resetup" hidden>Run setup again</button>
      </div>
    </main>
    <script src="start.js"></script>
  </body>
</html>
