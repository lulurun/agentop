<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agentop</title>
    <link rel="stylesheet" href="start.css" />
  </head>
  <body>
    <main>
      <h1 id="title">Starting agentop…</h1>
      <p id="detail">Starting the service on this computer.</p>
      <pre id="log" hidden></pre>
      <div id="actions" hidden>
        <button type="button" id="retry">Try again</button>
      </div>
      <p id="help" hidden>
        To install agentop, see the setup guide at
        <code>github.com/lulurun/agentop/blob/main/docs/setup.md</code>.
      </p>
    </main>
    <script src="start.js"></script>
  </body>
</html>
