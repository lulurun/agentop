# Publishes a GitHub release for a service tag, v*, pushed by scripts/release-ui.sh.
# The release is the tagged source: a service updates by checking out the tag,
# installing it, and building the UI (docs/design.md sections 8.4 and 8.5).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches pyproject.toml
        run: |
          version=$(sed -nE 's/^version = "(.*)"/\1/p' pyproject.toml | head -1)
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME, but pyproject.toml says $version"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the UI builds
        run: scripts/build-ui.sh --clean

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "agentop $GITHUB_REF_NAME" --generate-notes --verify-tag --latest
