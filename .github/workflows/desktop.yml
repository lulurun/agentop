# Builds the desktop app for Linux (AppImage) and macOS (the wrapper only: the
# UI comes from the service; no Windows, which has no tmux to run a service), and
# publishes it as a GitHub release when a desktop-v* tag is pushed, for example:
#
#   git tag desktop-v0.2.0 && git push origin desktop-v0.2.0
#
# The tag must match "version" in desktop/src-tauri/tauri.conf.json. Each build
# is signed with the updater key (secret TAURI_SIGNING_PRIVATE_KEY, and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD if it has one). Installed apps read
# latest.json from the fixed "desktop-latest" release, which the last job points
# at this release. See docs/design.md sections 4.2 and 8.5.
name: desktop

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles appimage
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app's version
        shell: bash
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          [[ "desktop-v$version" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME, but tauri.conf.json says $version"; exit 1; }

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci
        working-directory: desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "agentop desktop ${{ github.ref_name }}"
          releaseBody: "The desktop app. It updates itself from here; see docs/setup.md#desktop-app to install it the first time."
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  point-latest:
    # Installed apps check one fixed address, which "releases/latest" can't be: the
    # newest release may be a service release.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Copy latest.json to the desktop-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json
          gh release view desktop-latest >/dev/null 2>&1 || \
            gh release create desktop-latest --title "Desktop app: update feed" \
              --notes "Not a release. Holds latest.json, which installed apps read to find the newest desktop-v* release." \
              --latest=false
          gh release upload desktop-latest latest.json --clobber
