# Builds the desktop app for Linux (AppImage) and macOS (the wrapper only: the
# UI comes from the service; no Windows, which has no tmux to run a service), and
# publishes it as the agentop-desktop release when scripts/release.sh pushes a v* tag.
#
# The tag must match the version in pyproject.toml and tauri.conf.json. Each build is
# signed with the updater key (secret TAURI_SIGNING_PRIVATE_KEY, and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD if it has one). Installed apps read latest.json
# from releases/latest, which is always this app: it is the only release. See
# docs/design.md sections 4.2 and 8.5.
name: desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles appimage
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the versions
        shell: bash
        run: |
          app=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          service=$(sed -nE 's/^version = "(.*)"/\1/p' pyproject.toml | head -1)
          [[ "v$app" == "$GITHUB_REF_NAME" && "v$service" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME, but tauri.conf.json says $app and pyproject.toml $service"; exit 1; }

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci
        working-directory: desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "agentop-desktop ${{ github.ref_name }}"
          releaseBody: "agentop-desktop. It updates itself from here; see docs/setup.md#desktop-app to install it the first time."
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
