# agentop.wolfdrawer.net: agentop on the devhost, through eiger-tunnel.
#
# Installed by setup-wolfdrawer.sh as /etc/nginx/sites-available/wolfdrawer and
# linked into sites-enabled, which the main nginx.conf already includes. It only
# answers for this name, so the other sites on this host are unaffected. To
# remove it, delete that link and reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name agentop.wolfdrawer.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wolfdrawer-acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- https: needs the certificate, so setup-wolfdrawer.sh adds it after issuing ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agentop.wolfdrawer.net;

    ssl_certificate     /etc/letsencrypt/live/agentop.wolfdrawer.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentop.wolfdrawer.net/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:7775;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # The session list and the terminal are WebSockets
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
