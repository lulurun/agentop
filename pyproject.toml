[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentop"
version = "2.6.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Codex compresses older transcripts; the Memory plugin reads them.
    "zstandard>=0.22",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "httpx>=0.27", "websockets>=13"]

[project.scripts]
# `agentop.cli`, not a bare `cli`: a top-level `cli` module collides with any
# other distribution that ships one, and the command then runs the wrong tool.
agentop = "agentop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

# Found rather than listed: the list named `agentop.agents` after it was split into
# `actors` and `agentclis`, and the build refused to run.
[tool.setuptools.packages.find]
where = ["src"]
include = ["agentop*"]

[tool.setuptools.package-data]
"agentop.plugins.dialogue.scenarios" = ["*.toml", "shelf/*.toml", "README.md"]
"agentop.service" = ["webdist/**/*", "update.sh"]
# The skills `agentop serve` installs for the agent tools.
"agentop.skills" = ["*/**/*", "README.md"]
"agentop.coordinator_skill" = ["SKILL.md", "RULES.md"]
# Each plugin folder is a package with its manifest beside it.
"*" = ["plugin.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each test has its own tmux server, home and ports. `-n 0` runs one at a time.
addopts = "-n 8"
pythonpath = ["src"]

[tool.ruff.lint]
extend-select = ["I"]
