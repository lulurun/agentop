[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "psutil>=5.9.0",
]

[project.scripts]
agentop = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["agentop", "agentop.agents", "agentop.dialogue", "agentop.dialogue.scenarios"]
py-modules = ["cli"]

[tool.setuptools.package-data]
"agentop.dialogue.scenarios" = ["*.toml"]
