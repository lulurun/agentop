[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
# `agentop.cli`, not a bare `cli`: a top-level `cli` module collides with any
# other distribution that ships one, and the command then runs the wrong tool.
agentop = "agentop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

# Found rather than listed: the list named `agentop.agents` after it was split into
# `actors` and `agentclis`, and the build refused to run.
[tool.setuptools.packages.find]
where = ["src"]
include = ["agentop*"]

[tool.setuptools.package-data]
"agentop.dialogue.scenarios" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
extend-select = ["I"]
